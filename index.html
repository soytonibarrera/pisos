<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<title>Pisos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pisos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F9; --card:#FFFFFF; --ink:#16213A; --muted:#6B7690; --line:#E4E8F0;
  --hero:#1B2A4A; --hero-ink:#FFFFFF; --accent:#3D6BFF;
  --ok:#16A36A; --ok-bg:#E3F6EE; --due:#E5484D; --due-bg:#FDECEC; --free:#D98A00; --free-bg:#FFF4DC;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink);
  -webkit-tap-highlight-color:transparent;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1422; --card:#172035; --ink:#EEF1F7; --muted:#8E9AB5; --line:#243049;
  --hero:#1F2F55; --accent:#7B9BFF; --ok:#3DD598; --ok-bg:#12352A; --due:#FF7A7E; --due-bg:#3A1C22; --free:#FFC04D; --free-bg:#3A2E12;}}
:root[data-theme="dark"]{--bg:#0E1422; --card:#172035; --ink:#EEF1F7; --muted:#8E9AB5; --line:#243049;
  --hero:#1F2F55; --accent:#7B9BFF; --ok:#3DD598; --ok-bg:#12352A; --due:#FF7A7E; --due-bg:#3A1C22; --free:#FFC04D; --free-bg:#3A2E12;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);font-size:15px;line-height:1.4}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 110px}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:18px 18px 20px}
.mrow{display:flex;align-items:center;justify-content:space-between}
.mrow h1{margin:0;font-size:1.05rem;font-weight:600;text-transform:capitalize;opacity:.9}
.mrow button{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:1.2rem}
.big{margin-top:14px;font-size:2.4rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.sub{margin-top:6px;opacity:.75;font-size:.9rem}
.prog{height:8px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;background:#4ADE9A;border-radius:4px;transition:width .4s}
.kpis{display:flex;gap:8px;margin-top:16px}
.kpi{flex:1;background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.kpi{min-width:0}.kpi b{display:block;font-size:clamp(.82rem,3.9vw,1.15rem);font-weight:700;white-space:nowrap}
.kpi span{font-size:.75rem;opacity:.75}

.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:.85rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--due);color:#fff;font-size:.72rem;text-align:center}

.group{margin-top:18px}
.ghead{display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px}
.ghead h2{margin:0;font-size:1rem;font-weight:700}
.ghead small{color:var(--muted);font-size:.8rem;font-weight:500;display:block}
.ghead button{color:var(--accent);font-weight:600;font-size:.85rem;padding:6px}
.list{background:var(--card);border-radius:18px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.item:first-child{border-top:0}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;color:#fff}
.info{flex:1;min-width:0}
.info b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info span{color:var(--muted);font-size:.8rem}
.right{text-align:right;flex:none}
.right .eur{font-weight:700;font-size:.95rem}
.pill{display:inline-block;margin-top:4px;padding:4px 10px;border-radius:999px;font-size:.75rem;font-weight:700}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.due{background:var(--due-bg);color:var(--due)}
.pill.free{background:var(--free-bg);color:var(--free)}
.addrow{display:block;width:100%;padding:13px;border-top:1px solid var(--line);color:var(--accent);font-weight:600;font-size:.9rem}
.status{text-align:center;color:var(--muted);font-size:.75rem;margin-top:22px}
.empty{background:var(--card);border-radius:18px;padding:30px;text-align:center;color:var(--muted)}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#fff;border-radius:999px;padding:14px 22px;font-weight:700;box-shadow:0 8px 24px rgba(61,107,255,.35)}

dialog{border:0;padding:0;width:100%;max-width:560px;margin:auto auto 0;border-radius:24px 24px 0 0;background:var(--card);color:var(--ink);max-height:92vh}
dialog::backdrop{background:rgba(8,12,24,.5)}
@media(min-width:620px){dialog{margin:auto;border-radius:24px}}
.sheet{padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto;max-height:92vh}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 2px;font-size:1.25rem;font-weight:800}
.sheet .hint{color:var(--muted);font-size:.85rem;margin-bottom:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin:12px 0 5px}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
textarea{min-height:64px;resize:vertical}
.acts{display:flex;gap:8px;margin-top:12px}
.acts a{flex:1;text-align:center;padding:10px;border-radius:12px;background:var(--bg);font-weight:600;text-decoration:none;color:var(--ink);font-size:.9rem}
.paybox{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--bg)}
.paybox button{padding:8px 14px;border-radius:10px;font-weight:700}
.months{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.months span{padding:3px 9px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-size:.75rem;font-weight:600;text-transform:capitalize}
.btns{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:700;background:var(--bg)}
.btn.main{background:var(--accent);color:#fff}
.del{display:block;margin:14px auto 0;color:var(--due);font-weight:600;font-size:.9rem;padding:6px}
.gbar{display:flex;gap:8px;margin-top:12px}
.gbar button{flex:1;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.9rem}
.gbar button.main{background:var(--accent);color:#fff;border-color:var(--accent)}
.crumbs button{color:var(--accent);font-weight:600;padding:2px 0}
.files{margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:60px}
.files .f{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-top:1px solid var(--line);text-align:left;text-decoration:none;color:var(--ink)}
.files .f:first-child{border-top:0}
.files .f span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .f small{color:var(--muted);flex:none}
.files .msg{padding:18px;text-align:center;color:var(--muted)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1;padding:10px 4px;border-radius:12px;font-weight:700;font-size:.85rem;color:var(--muted)}
.nav button[aria-pressed="true"]{background:var(--bg);color:var(--accent)}
.addpiso{display:block;width:100%;margin-top:18px;padding:14px;border-radius:16px;border:1px dashed var(--line);color:var(--accent);font-weight:700}
.sheet h4,.fis h4{margin:18px 0 0;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font:inherit;color:inherit}
label.chk{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--ink);font-weight:500}
label.chk input{width:20px;height:20px;flex:none;padding:0}
.ledger{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px 10px;align-items:center}
.ledger label{margin:0;text-transform:capitalize;white-space:nowrap}
.ledger input{padding:9px 10px;min-width:0}
.files .f b{font-weight:600}
.fis{padding:4px 14px 14px}
.fis h4{margin-top:14px;padding-bottom:4px}
.frow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.frow span{min-width:0}.frow small{display:block;color:var(--muted);font-size:.78rem}
.frow b{flex:none;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.frow.tot b,.frow.tot span{font-weight:800}.frow.big{font-size:1rem}.frow.mut{color:var(--muted)}
.avisos{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--free-bg);color:var(--free);font-size:.82rem;font-weight:600;display:grid;gap:6px}
.rep{padding:6px 0 12px;border-top:1px solid var(--line)}.rep .frow{border-top:0}
.desg{color:var(--muted);font-size:.8rem;margin-top:-4px}
.repc{display:flex;gap:10px;align-items:center;margin-top:8px}.repc label{margin:0;flex:1;font-size:.82rem}.repc input[type=number]{width:110px;padding:9px 10px}
.rep .acts a{font-size:.85rem;padding:9px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="mrow"><button id="prev" aria-label="Mes anterior">‹</button><h1 id="mlabel"></h1><button id="next" aria-label="Mes siguiente">›</button></div>
    <div class="big" id="cobrado">0 €</div>
    <div class="sub" id="esperado">cobrado este mes</div>
    <div class="prog"><i id="bar" style="width:0"></i></div>
    <div class="kpis">
      <div class="kpi"><b id="k-pend">0</b><span>pendientes</span></div>
      <div class="kpi"><b id="k-occ">0/0</b><span>ocupadas</span></div>
      <div class="kpi"><b id="k-pers">0</b><span>personas</span></div>
    </div>
  </div>
  <div class="gbar" id="gbar"></div>
  <input type="file" id="imp" accept="application/json,.json" hidden>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <div class="status" id="status">Cargando…</div>
</div>
<nav class="nav"><button type="button" data-v="cobros">Cobros</button><button type="button" data-v="gastos">Gastos</button><button type="button" data-v="reparto">Reparto</button><button type="button" data-v="hacienda">Hacienda</button></nav>
<dialog id="dlg"><form method="dialog" class="sheet" id="form"></form></dialog>

<script>
const $=s=>document.querySelector(s);
const eur=n=>(Number(n)||0).toLocaleString('es-ES',{minimumFractionDigits:0,maximumFractionDigits:2})+' €';
const num=v=>Math.round((Number(v)||0)*100)/100;
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#3D6BFF','#8B5CF6','#EC4899','#F97316','#14B8A6','#0EA5E9','#84CC16','#EAB308'];
const color=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return COLORS[Math.abs(h)%COLORS.length];};
const initials=s=>String(s||'?').split(/\s+/).filter(w=>w.length>1&&!/^(y|su|de|la)$/i.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'?';
let pisos=[],filtro='todos',vista='cobros',ajustes={titular:'',iban:''};const LS='habitaciones-pisos';
let cur=new Date();cur.setDate(1);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoy=()=>iso(new Date());
const mkey=d=>iso(d).slice(0,7);
const mname=k=>new Date(k+'-01T12:00').toLocaleDateString('es-ES',{month:'short',year:'2-digit'});
const fdate=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(2,4):'';
const dim=mk=>new Date(Number(mk.slice(0,4)),Number(mk.slice(5,7)),0).getDate();
const mfin=mk=>mk+'-'+String(dim(mk)).padStart(2,'0');
const dias=(a,b)=>Math.round((Date.parse(b+'T12:00Z')-Date.parse(a+'T12:00Z'))/864e5)+1;
const ord=a=>[...a].sort((x,y)=>String(x.nombre).localeCompare(String(y.nombre),'es',{numeric:true}));

/* ---------- Modelo: piso > habitaciones > estancias (historial) > pagos ; piso > gastos ---------- */
// Días que una estancia cae dentro del intervalo [a,b]
// Si no se conoce la fecha de alta, se toma el primer mes con cobro registrado
const ent=e=>e.entrada||((k=>k?k+'-01':'')(Object.keys(e.pagos||{}).sort()[0]));
function solape(e,a,b){const en=ent(e),x=en&&en>a?en:a,y=e.salida&&e.salida<b?e.salida:b;return y>=x?dias(x,y):0;}
// Un inquilino sin fecha de alta no cuenta en los meses con renta histórica sin detallar
const activa=(e,mk,h)=>!!e.inquilino&&!(h&&!e.entrada&&h.historico&&h.historico[mk]!=null)&&solape(e,mk+'-01',mfin(mk))>0;
const hist=(h,mk)=>h.historico&&h.historico[mk]!=null?num(h.historico[mk]):null;
// Renta esperada del mes, prorrateada por días si entra o sale a mitad de mes
function esperado(e,mk){const n=dim(mk),d=solape(e,mk+'-01',mfin(mk));return d>=n?num(e.precio):num(e.precio*d/n);}
const pagado=(e,mk)=>e.pagos&&e.pagos[mk]?num(e.pagos[mk].imp):null;
const total=g=>num((Number(g.base)||0)+(Number(g.iva)||0));
// Convierte datos de la versión anterior (un inquilino por habitación) al modelo con historial
function normalize(arr){return (arr||[]).map(p=>{
  p.habitaciones=(p.habitaciones||[]).map(h=>{
    if(!h.estancias){
      const e={id:uid(),inquilino:h.inquilino||'',personas:Number(h.personas)||1,precio:Number(h.precio)||0,entrada:h.entrada||'',salida:h.salida||'',
        telefono:h.telefono||'',nif:h.nif||'',fianza:Number(h.fianza)||0,notas:h.notas||'',pagos:{}};
      Object.entries(h.pagos||{}).forEach(([k,v])=>{e.pagos[k]={f:v,imp:e.precio};});
      h={id:h.id,nombre:h.nombre,precio:e.precio,estancias:e.inquilino?[e]:[]};
    }
    h.historico=h.historico||{};h.estancias.forEach(e=>{e.pagos=e.pagos||{};});return h;});
  p.gastos=p.gastos||[];return p;});}
const P=id=>pisos.find(p=>p.id===id);
const H=(p,id)=>p&&p.habitaciones.find(h=>h.id===id);
const E=(h,id)=>h&&h.estancias.find(e=>e.id===id);

// Categoría -> [grupo fiscal, se reparte entre inquilinos por defecto]
const CATS={'Electricidad':['sum',1],'Gas':['sum',1],'Agua':['sum',1],'Internet':['sum',1],'Comunidad':['com',0],'IBI':['trib',0],'Basuras':['trib',0],
  'Seguro':['seg',0],'Intereses hipoteca':['int',0],'Hipoteca (cuota)':['nd',0],'Reparación':['rep',0],'Mobiliario':['mob',0],'Gestoría / jurídico':['jur',0],'Otros':['otros',0]};
const GRUPOS={int:'Intereses y gastos de financiación',rep:'Reparación y conservación',com:'Gastos de comunidad',trib:'Tributos, recargos y tasas',
  seg:'Primas de seguros',sum:'Servicios y suministros',jur:'Formalización de contratos y defensa jurídica',mob:'Amortización de bienes muebles (10 % anual)',otros:'Otros gastos deducibles'};

function hero(big,sub,pct,kpis){
  $('#cobrado').textContent=big;$('#esperado').textContent=sub;
  $('.prog').hidden=pct==null;$('#bar').style.width=(pct||0)+'%';
  $('.kpis').innerHTML=kpis.map(([v,l])=>`<div class="kpi"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('');
}
function chips(extra){
  const ch=[['todos','Todos']].concat(extra,ord(pisos).map(p=>[p.id,p.nombre]));
  $('#chips').innerHTML=ch.map(([id,n,c])=>`<button type="button" class="chip" data-f="${id}" aria-pressed="${filtro===id}">${esc(n)}${c?`<span class="c">${c}</span>`:''}</button>`).join('');
}
const visibles=()=>ord(pisos).filter(p=>filtro==='todos'||filtro==='pend'||p.id===filtro);

function render(){
  document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===vista));
  if(vista==='gastos')renderGastos();else if(vista==='reparto')renderReparto();else if(vista==='hacienda')renderHacienda();else renderCobros();
}

/* ---------- Cobros ---------- */
function filasMes(p,mk){const out=[];
  ord(p.habitaciones).forEach(h=>{const es=h.estancias.filter(e=>activa(e,mk,h)).sort((a,b)=>(a.entrada||'').localeCompare(b.entrada||''));
    if(es.length)es.forEach(e=>out.push({h,e}));else out.push({h,e:null,hv:hist(h,mk)});});return out;}
function renderCobros(){
  const mk=mkey(cur);
  $('#mlabel').textContent=cur.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  let tot=0,occ=0,esp=0,cob=0,pers=0,pend=0;
  pisos.forEach(p=>p.habitaciones.forEach(h=>{tot++;const es=h.estancias.filter(e=>activa(e,mk,h)),hv=hist(h,mk);if(es.length||(hv!=null&&!es.length))occ++;if(!es.length&&hv!=null){esp+=hv;cob+=hv;}
    es.forEach(e=>{pers+=Number(e.personas)||1;const pg=pagado(e,mk);esp+=pg!=null?pg:esperado(e,mk);if(pg!=null)cob+=pg;else pend++;});}));
  hero(eur(cob),'cobrado de '+eur(esp)+' este mes',esp?Math.round(cob/esp*100):0,[[pend,'pendientes'],[occ+'/'+tot,'ocupadas'],[pers,'personas']]);
  if(filtro==='pend'&&!pend)filtro='todos';
  chips([['pend','Pendientes',pend]]);
  if(!pisos.length){$('#list').innerHTML='<div class="empty group">Añade tu primer piso o importa tus datos.</div><button type="button" class="addpiso" data-act="piso">+ Añadir piso</button>';return;}
  let html='';
  visibles().forEach(p=>{
    let fs=filasMes(p,mk);
    if(filtro==='pend')fs=fs.filter(f=>f.e&&pagado(f.e,mk)==null);
    if(filtro==='pend'&&!fs.length)return;
    const act=p.habitaciones.filter(h=>h.estancias.some(e=>activa(e,mk,h))||hist(h,mk)!=null).length;
    const renta=p.habitaciones.reduce((s,h)=>s+(h.estancias.some(e=>activa(e,mk,h))?h.estancias.filter(e=>activa(e,mk,h)).reduce((a,e)=>a+esperado(e,mk),0):(hist(h,mk)||0)),0);
    html+=`<div class="group"><div class="ghead"><div><h2>${esc(p.nombre)}</h2><small>${esc(p.ciudad||'')}${p.ciudad?' · ':''}${act}/${p.habitaciones.length} ocupadas · ${eur(renta)}</small></div>
      <button type="button" data-editpiso="${p.id}">Editar</button></div><div class="list">`+
      fs.map(({h,e,hv})=>{
        if(!e&&hv!=null)return `<button type="button" class="item" data-room="${p.id}|${h.id}"><span class="av" style="background:var(--muted)">H</span>
          <span class="info"><b>Sin detallar (histórico)</b><span>${esc(h.nombre)}</span></span><span class="right"><span class="eur">${eur(hv)}</span><br><span class="pill ok">Cobrado</span></span></button>`;

/* ---------- Hacienda: resumen anual por inmueble ---------- */
function fiscal(p,Y){
  const a=Y+'-01-01',b=Y+'-12-31',t=hoy(),fin=t<a?null:(t<b?t:b);
  let rentas=0,dOcc=0,dTot=0;const inq=[];
  p.habitaciones.forEach(h=>{if(fin)dTot+=dias(a,fin);
    const hc=Object.entries(h.historico||{}).reduce((s,[k,v])=>k.slice(0,4)==Y?s+num(v):s,0);
    const hk=Object.keys(h.historico||{}).filter(k=>k.slice(0,4)==Y).sort();
    hk.forEach(k=>{if(fin&&k+'-01'<=fin)dOcc+=Math.min(dim(k),dias(k+'-01',fin));});
    if(hc){rentas+=hc;inq.push({hab:h.nombre,n:'Inquilinos sin detallar (histórico)',nif:'',hist:1,ent:hk[0]+'-01',sal:mfin(hk[hk.length-1]),c:num(hc),d:0});}
    h.estancias.forEach(e=>{let c=0;Object.entries(e.pagos).forEach(([k,v])=>{if(k.slice(0,4)==Y)c+=num(v.imp);});
      const d=fin&&e.inquilino?solape(e,a,fin):0;dOcc+=d;rentas+=c;
      if(c||d)inq.push({hab:h.nombre,n:e.inquilino,nif:e.nif||'',ent:e.entrada||'',sal:e.salida||'',c:num(c),d});});});
  const gr={};let rep=0,nd=0;
  p.gastos.forEach(g=>{const y=Number((g.mes||g.fecha||'').slice(0,4)),c=CATS[g.cat]||CATS.Otros,tt=total(g);
    if(c[0]==='mob'){if(y<=Y&&y>Y-10)gr.mob=(gr.mob||0)+tt*0.1;return;}
    if(y!==Y)return;if(c[0]==='nd'){nd+=tt;return;}
    gr[c[0]]=(gr[c[0]]||0)+tt;if(g.rep)rep+=tt;});
  const ded=num(Object.values(gr).reduce((s,v)=>s+v,0));
  const vc=Number(p.vCat)||0,vcc=Number(p.vCatCons)||0,va=Number(p.vAdq)||0;
  const amort=vc&&vcc?num(0.03*Math.max(va,vc)*vcc/vc):null;
  rentas=num(rentas);rep=num(rep);
  return {rentas,rep,ing:num(rentas+rep),gr,ded,nd:num(nd),amort,neto:num(rentas+rep-ded-(amort||0)),inq,dOcc,dTot};
}
function renderHacienda(){
  const Y=cur.getFullYear();

    const sinNif=f.inq.filter(i=>!i.nif&&!i.hist).length;if(sinNif)av.push(sinNif+' inquilinos sin NIF/NIE');
    return `<div class="group"><div class="ghead"><div><h2>${esc(p.nombre)}</h2><small>${esc(p.direccion||p.ciudad||'')}</small></div><button type="button" data-editpiso="${p.id}">Datos fiscales</button></div>
    <div class="list fis">
      ${row('Referencia catastral',esc(p.refCat||'—'))}${row('Titularidad',esc(p.pct??100)+' %')}
      ${row('Días arrendados (habitación-día)',f.dTot?f.dOcc+' de '+f.dTot+' · '+Math.round(f.dOcc/f.dTot*100)+' %':'—')}

/* ---------- Reparto de gastos y mensajes de cobro ---------- */
// Ciclo: gastos del mes elegido + alquiler del mes siguiente. Reparto por persona y días de estancia.
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const nombreMes=mk=>MESES[Number(mk.slice(5,7))-1];
const sigMes=mk=>{const d=new Date(mk+'-01T12:00');d.setMonth(d.getMonth()+1);return mkey(d);};
const eur2=n=>(Number(n)||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const NOMBRE_GASTO={Electricidad:'luz',Gas:'gas',Agua:'agua',Internet:'internet'};
let repEx={}; // ajustes de esta sesión por inquilino y mes: {fuera, extra}
function reparto(p,mk){
  const nx=sigMes(mk),a=mk+'-01',b=mfin(mk);
  const gs=p.gastos.filter(g=>g.mes===mk&&g.rep).sort((x,y)=>(x.fecha||'').localeCompare(y.fecha||''));
  const tg=num(gs.reduce((s,g)=>s+total(g),0));
  const filas=[];
  ord(p.habitaciones).forEach(h=>h.estancias.forEach(e=>{
    const enM=activa(e,mk,h),enN=activa(e,nx,h);if(!enM&&!enN)return;
    const x=repEx[e.id+'|'+mk]||{},dd=enM?solape(e,a,b):0;
    filas.push({h,e,dd,peso:x.fuera?0:(Number(e.personas)||1)*dd,alq:enN?esperado(e,nx):0,extra:num(x.extra),fuera:!!x.fuera});}));
  const tp=filas.reduce((s,f)=>s+f.peso,0);
  filas.forEach(f=>{f.parte=tp?num(tg*f.peso/tp):0;});
  if(tp){const dif=num(tg-filas.reduce((s,f)=>s+f.parte,0));if(dif){const f=[...filas].sort((x,y)=>y.peso-x.peso)[0];f.parte=num(f.parte+dif);}}
  filas.forEach(f=>{f.total=num(f.parte+f.alq+f.extra);});
  return {gs,tg,filas,tp,nx,porPersona:tp?num(tg*dim(mk)/tp):0};
}
function mensaje(p,r,f,mk){
  const M=nombreMes(mk),N=nombreMes(r.nx),n=Number(f.e.personas)||1,pl=n>1,full=f.dd>=dim(mk);
  const L=[`Hola ${f.e.inquilino} 👋`,'',`${pl?'Os':'Te'} paso el cobro de ${f.h.nombre.toLowerCase()} en ${p.direccion||p.nombre}:`,''];
  if(f.alq)L.push(`• Alquiler de ${N}: ${eur2(f.alq)}`+(f.alq!==num(f.e.precio)?' (parte proporcional)':''));
  if(f.parte)L.push(`• Gastos de ${M}: ${eur2(f.parte)}`+(pl||!full?` (${pl?n+' personas':'1 persona'}${full?'':', '+f.dd+' días'})`:''));
  if(f.extra)L.push(`• ${f.extra>0?'Otros pendientes':'Descuento'}: ${eur2(f.extra)}`);
  L.push(`• TOTAL: ${eur2(f.total)}`);
  if(f.parte){L.push('',`Gastos del piso de ${M}: `+r.gs.map(g=>(NOMBRE_GASTO[g.cat]||g.cat.toLowerCase())+' '+eur2(total(g))).join(' + ')+` = ${eur2(r.tg)}, repartidos por persona y días de estancia`+(pl?`; al ser ${n} personas, ${pl?'os':'te'} corresponden ${n} partes.`:'.'));}
  L.push('','Ingreso a:');
  if(ajustes.titular)L.push(`• Titular: ${ajustes.titular}`);
  if(ajustes.iban)L.push(`• IBAN: ${ajustes.iban}`);
  L.push(`• Concepto: ${f.e.inquilino} · `+[f.parte||f.extra?`Gastos de ${M}`:'',f.alq?`Alquiler de ${N}`:''].filter(Boolean).join(' y '));
  L.push('',`Cualquier duda me ${pl?'decís':'dices'}. ¡Gracias!`);
  return L.join('\n');
}

    </div></div>`;}).join('')+

function ensureClient(){
  if(tokenClient)return true;
  if(!(window.google&&google.accounts&&google.accounts.oauth2))return false;
  tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,
    callback:r=>{const p=pendingAuth;pendingAuth=null;if(!p)return;
      if(r.error)return p.rej(new Error(r.error_description||r.error));
      token=r.access_token;tokenExp=Date.now()+(Number(r.expires_in)||3600)*1000-60000;
      try{localStorage.setItem(TK,JSON.stringify({token,tokenExp}))}catch(e){}
      p.res();},
    error_callback:e=>{const p=pendingAuth;pendingAuth=null;if(p)p.rej(new Error(e&&e.type==='popup_closed'?'Inicio de sesión cancelado':'No se pudo abrir el inicio de sesión'));}});
  return true;

async function g(url,opt={}){
  if(!signed()){renderBar();throw new Error('Sesión caducada, vuelve a conectar');}
  const r=await fetch(url.startsWith('http')?url:'https://www.googleapis.com/drive/v3/'+url,
    {...opt,headers:{Authorization:'Bearer '+token,...(opt.headers||{})}});
  if(r.status===401){token=null;renderBar();throw new Error('Sesión caducada, vuelve a conectar');}
  if(!r.ok){let m='Error '+r.status;try{m=(await r.json()).error.message||m}catch(e){}const er=new Error(m);er.status=r.status;throw er;}
  return r;
}

}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-pay],[data-stay],[data-room],[data-addroom],[data-editpiso],[data-gasto],[data-addgasto],[data-f],[data-v],[data-act],[data-folder],[data-crumb]');if(!t)return;
  const d=t.dataset;
  if(d.v){vista=d.v;window.scrollTo(0,0);render();return;}
  if(d.act){const a=d.act;
    if(a==='in')signIn().then(connect).catch(er=>{renderBar();status(er.message);});
    else if(a==='out')signOut();
    else if(a==='imp')$('#imp').click();
    else if(a==='docs'){path=[{id:rootId,name:'Documentos'}];showDocs();}
    else if(a==='piso')openPiso();
    else if(a==='csv')exportCsv();
    else if(a==='ajustes')openAjustes();
    return;}
  if(d.folder){path.push({id:d.folder,name:d.name});showDocs();return;}
  if(d.crumb){path=path.slice(0,Number(d.crumb)+1);showDocs();return;}
  if(d.f){filtro=d.f;render();return;}
  if(d.pay){e.stopPropagation();const[a,b,c]=d.pay.split('|');togglePay(a,b,c);return;}
  if(d.stay){const[a,b,c]=d.stay.split('|');const p=P(a),h=H(p,b);openStay(p,h,E(h,c));return;}
  if(d.room){const[a,b]=d.room.split('|');const p=P(a);openRoom(p,H(p,b));return;}
  if(d.addroom){openRoom(P(d.addroom));return;}
  if(d.gasto){const[a,b]=d.gasto.split('|');const p=P(a);openGasto(p,p.gastos.find(g=>g.id===b));return;}
  if(d.addgasto){openGasto(P(d.addgasto));return;}
  if(d.editpiso)openPiso(P(d.editpiso));
});
const paso=n=>{cur.setMonth(cur.getMonth()+n*(vista==='hacienda'?12:1));render();};
$('#prev').onclick=()=>paso(-1);
$('#next').onclick=()=>paso(1);
$('#imp').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importar(f);};
try{pisos=normalize(JSON.parse(localStorage.getItem(LS)||'[]'));ajustes=JSON.parse(localStorage.getItem(LS+'-aj')||'null')||ajustes;dirty=!!localStorage.getItem(LS+'-dirty');}catch(e){pisos=[];}
try{const s=JSON.parse(localStorage.getItem(TK)||'null');if(s&&s.tokenExp>Date.now()){token=s.token;tokenExp=s.tokenExp;}}catch(e){}
render();renderBar();
if(signed())connect().catch(er=>{renderBar();status(er.message);});
else status(pisos.length?'Datos de este dispositivo · conecta para sincronizar':'Conecta con Google Drive para empezar');
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
